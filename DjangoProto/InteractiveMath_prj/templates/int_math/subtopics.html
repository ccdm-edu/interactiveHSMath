<!--
 * ============================================================================
 * COMPONENT: Django HTML 
 * FILE:      subtopics.html
 * ============================================================================
 * 
 * DESCRIPTION:
 * This controls appearance of subtopics off to left side of page.  Actual values are
 * populated from database.
 * 
 * DEPENDENCIES:
 * 
 * ARCHITECTURE NOTES:
 * 
 * FIRST PRODUCTION VERSION: 2026-06-07
 * AUTHOR:     C. DeMeyer (with Gemini AI assist)
 * ============================================================================
 -->

<ul class="nav flex-column">
  {% if subtopics %}
    <!-- Sidebar Header matching your established structure -->
    <li class="nav-header-item" style="list-style: none;">
      <p id="headerForSubtopics">Subtopics</p>
    </li>

    <!-- Loop through dynamic subtopics, mirroring the submenu styling -->
    {% for s in subtopics %}
      <li class="nav-item">
        <a class="nav-link dropdown-item" href="{{ s.url }}">
          <!-- Automatically increments numbers (1., 2., 3., etc.) -->
          <span class="track-number">{{ forloop.counter }}.</span>
          
          <!-- Dynamic icon fallback: checks for a model property, otherwise defaults to music emoji -->
          <span class="track-icon">{% if s.icon %}{{ s.icon }}{% else %}🎵{% endif %}</span>
          
          <!-- Dynamic text title -->
          <span class="track-name">{{ s.title }}</span>
        </a>
      </li>
    {% endfor %}

  {% else %}
    <!-- Fallback if no subtopics exist -->
    <li class="nav-item" id="NoSubtopicAvail" style="list-style: none !important;">
      Select a subject from menu along top right and will get subtopics here.
    </li>
  {% endif %}
</ul>
